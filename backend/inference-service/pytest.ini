[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
# No on-disk cache: this service's no-write guarantee is easier to hold (and to test)
# when the tooling around it does not create files either.
addopts = -p no:cacheprovider
# Warnings from *our* code are failures, not noise. The one exception is Starlette's own
# "install httpx2" deprecation, which is raised while importing fastapi.testclient, i.e. before
# any test runs: left as an error it aborts collection with zero tests executed. Later filters
# take precedence, so this carve-out is scoped to that exact message and nothing else.
filterwarnings =
    error::UserWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*:UserWarning
